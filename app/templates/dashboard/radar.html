{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --primary-glow: #00f0ff;
        --danger-glow: #ff0055;
    }
    .radar-dashboard {
        background-color: #0b0f19;
        color: #ffffff;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 70vh;
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.05), transparent 25%);
    }

    .radar-dashboard h2 {
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: linear-gradient(90deg, #fff, #8b9bb4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 5px;
    }

    .radar-subtitle {
        color: #8b9bb4;
        font-size: 14px;
        margin-bottom: 40px;
    }

    .radar-container {
        position: relative;
        width: 250px;
        height: 250px;
        margin: 0 auto;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(0, 240, 255, 0.1);
        transition: all 0.3s ease;
    }

    .radar-container.danger {
        box-shadow: 0 0 40px rgba(255, 0, 85, 0.2);
    }

    .progress-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }

    .progress-ring__bg {
        stroke: rgba(255,255,255,0.05);
    }

    .progress-ring__circle {
        stroke: var(--primary-glow);
        transition: stroke-dashoffset 0.15s linear, stroke 0.3s ease;
        transform-origin: 50% 50%;
    }

    .distance-display {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .distance-value {
        font-size: 64px;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .distance-value.danger {
        color: var(--danger-glow);
        text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }

    .distance-unit {
        font-size: 16px;
        color: #8b9bb4;
        margin-top: 4px;
        font-weight: 500;
    }

    .radar-status {
        margin-top: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-radius: 50px;
        background: rgba(0, 240, 255, 0.1);
        border: 1px solid rgba(0, 240, 255, 0.2);
        font-size: 14px;
        color: var(--primary-glow);
        transition: all 0.3s ease;
    }

    .radar-status.danger {
        background: rgba(255, 0, 85, 0.1);
        border: 1px solid rgba(255, 0, 85, 0.2);
        color: var(--danger-glow);
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--primary-glow);
        box-shadow: 0 0 10px var(--primary-glow);
        animation: pulse 2s infinite;
    }

    .radar-status.danger .status-dot {
        background-color: var(--danger-glow);
        box-shadow: 0 0 10px var(--danger-glow);
        animation: pulse-danger 1s infinite;
    }

    .radar-status.disconnected {
        background: rgba(255, 170, 0, 0.1);
        border: 1px solid rgba(255, 170, 0, 0.2);
        color: #ffaa00;
    }
    .radar-status.disconnected .status-dot {
        background-color: #ffaa00;
        box-shadow: 0 0 10px #ffaa00;
        animation: none;
    }

    @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
    }

    @keyframes pulse-danger {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 0, 85, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
    }
</style>

<div class="radar-dashboard">
    <h2>HC-SR04 Radar Monitor</h2>
    <div class="radar-subtitle">Hệ thống theo dõi khoảng cách cảm biến siêu âm</div>

    <div class="radar-container" id="radarContainer">
        <svg class="progress-ring" width="250" height="250">
            <circle class="progress-ring__bg" stroke-width="12" fill="transparent" r="110" cx="125" cy="125" />
            <circle class="progress-ring__circle" id="progressCircle" stroke-width="12" stroke-linecap="round" fill="transparent" r="110" cx="125" cy="125" />
        </svg>

        <div class="distance-display">
            <span class="distance-value" id="distanceValue">--</span>
            <span class="distance-unit">CENTIMETERS</span>
        </div>
    </div>

    <div class="radar-status disconnected" id="statusIndicator">
        <div class="status-dot"></div>
        <span id="statusText">Đang chờ nhận dữ liệu...</span>
    </div>
    
    <div class="mt-4">
        <small class="text-muted">Đảm bảo mạch ESP32 đang chạy và kết nối cùng mạng WiFi.</small>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const circle = document.getElementById('progressCircle');
    const distanceValue = document.getElementById('distanceValue');
    const radarContainer = document.getElementById('radarContainer');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    
    const radius = circle.r.baseVal.value;
    const circumference = radius * 2 * Math.PI;
    
    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = circumference;
    
    const MAX_DISTANCE = 400; // Giới hạn hiển thị 400cm

    function setProgress(distance) {
        const boundedDistance = Math.min(Math.max(distance, 0), MAX_DISTANCE);
        const percent = (MAX_DISTANCE - boundedDistance) / MAX_DISTANCE;
        const offset = circumference - percent * circumference;
        circle.style.strokeDashoffset = offset;
        
        distanceValue.innerText = Math.round(boundedDistance);

        if (boundedDistance < 20) {
            circle.style.stroke = 'var(--danger-glow)';
            distanceValue.classList.add('danger');
            radarContainer.classList.add('danger');
            statusIndicator.classList.add('danger');
            statusIndicator.classList.remove('disconnected');
            statusText.innerText = "CẢNH BÁO: Vật cản quá gần!";
        } else {
            circle.style.stroke = 'var(--primary-glow)';
            distanceValue.classList.remove('danger');
            radarContainer.classList.remove('danger');
            statusIndicator.classList.remove('danger');
            statusIndicator.classList.remove('disconnected');
            statusText.innerText = "An toàn - Đang nhận dữ liệu";
        }
    }

    // Polling API từ ESP32
    setInterval(() => {
        fetch('http://radar.local/distance')
            .then(response => response.text())
            .then(data => {
                const distance = parseFloat(data);
                if (!isNaN(distance)) {
                    setProgress(distance);
                }
            })
            .catch(error => {
                console.error("Lỗi khi kết nối API:", error);
                statusIndicator.classList.add('disconnected');
                statusIndicator.classList.remove('danger');
                statusText.innerText = "Mất kết nối với mạch...";
            });
    }, 1000);
</script>
{% endblock %}
