<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Patient Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-heartbeat"></i> HealthOS</h2>
            </div>
            
            <div class="patient-profile">
                <div class="avatar">
                    <img src="https://ui-avatars.com/api/?name=Thanh+Binh&background=3b82f6&color=fff&size=64" alt="Patient Avatar">
                </div>
                <div class="patient-info">
                    <h3>Trần Thanh Bình</h3>
                    <p>ID: #PT-84920</p>
                    <div class="patient-tags">
                        <span class="tag">Tuổi: 28</span>
                        <span class="tag">Nhóm máu: O+</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="#" class="active"><i class="fas fa-chart-line"></i> Live Dashboard</a>
                <a href="#" onclick="exportData()"><i class="fas fa-file-csv"></i> Xuất Báo Cáo (CSV)</a>
            </nav>
            
            <div class="system-status">
                <div class="status-indicator">
                    <span class="dot" id="connection-status"></span>
                    <span id="status-text">Đang kết nối...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Giám sát Sinh tồn (ICU)</h1>
                <div class="topbar-actions">
                    <button class="btn btn-outline"><i class="fas fa-cog"></i> Cài đặt Ngưỡng</button>
                    <div class="current-time" id="clock">00:00:00</div>
                </div>
            </header>

            <div class="dashboard-container">
                <!-- Metrics Grid -->
                <div class="metrics-grid">
                    <div class="card bpm-card" id="card-bpm">
                        <div class="card-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.42 4.58a5.4 5.4 0 0 0-7.65 0l-.77.78-.77-.78a5.4 5.4 0 0 0-7.65 0C1.46 6.7 1.33 10.28 4 13l8 8 8-8c2.67-2.72 2.54-6.3.42-8.42z"></path></svg></div>
                        <div class="card-content">
                            <h2>Nhịp tim (BPM)</h2>
                            <div class="value-unit">
                                <span id="bpm-val" class="value">--</span>
                                <span class="unit">bpm</span>
                            </div>
                            <div class="alert-msg" id="alert-bpm">Nguy hiểm!</div>
                        </div>
                    </div>

                    <div class="card spo2-card" id="card-spo2">
                        <div class="card-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg></div>
                        <div class="card-content">
                            <h2>Oxy trong máu</h2>
                            <div class="value-unit">
                                <span id="spo2-val" class="value">--</span>
                                <span class="unit">%</span>
                            </div>
                            <div class="alert-msg" id="alert-spo2">Thấp!</div>
                        </div>
                    </div>

                    <div class="card temp-card">
                        <div class="card-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg></div>
                        <div class="card-content">
                            <h2>Thân nhiệt</h2>
                            <div class="value-unit">
                                <span id="body-temp-val" class="value">--</span>
                                <span class="unit">°C</span>
                            </div>
                        </div>
                    </div>

                    <div class="card env-card">
                        <div class="card-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg></div>
                        <div class="card-content">
                            <h2>Môi trường</h2>
                            <div class="value-unit env-stats">
                                <span id="room-temp-val" class="value small">--°C</span>
                                <span class="divider">/</span>
                                <span id="humidity-val" class="value small">--%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ECG Chart -->
                <div class="chart-container">
                    <div class="chart-header">
                        <h2>Sóng Điện Tâm Đồ (ECG)</h2>
                        <span class="chart-badge live">LIVE</span>
                    </div>
                    <div class="canvas-wrapper">
                        <canvas id="ecgChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <script src="/static/script.js"></script>
</body>
</html>
