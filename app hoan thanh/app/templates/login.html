<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AIoT Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .login-brand {
            font-size: 1.8rem;
            font-weight: 700;
            color: #818cf8;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 12px;
            padding: 0.75rem 1.2rem;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #818cf8;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(129, 140, 248, 0.25);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-login {
            background: linear-gradient(90deg, #4f46e5 0%, #6366f1 100%);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="login-brand mb-2">
            <i class="fa-solid fa-microchip me-2"></i>AIoT Server
        </div>
        <p class="text-white-50 mb-4">Đăng nhập để quản trị hệ thống AIoT</p>
        
        {% if error %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-white py-2 mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/api/auth/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-white-50">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="Nhập username..." required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-white-50">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login w-100 mb-3">Đăng Nhập</button>
        </form>
    </div>
</body>
</html>
