<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - App Điều Khiển</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090a0f;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 25px 25px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.2;
        }
        .login-card {
            background: rgba(13, 15, 22, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.1);
            position: relative;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 15px; height: 15px;
            background: var(--primary);
            background: #00f0ff;
            clip-path: polygon(100% 0, 0 0, 100% 100%);
        }
        .login-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: #00f0ff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .form-control {
            background: rgba(0, 240, 255, 0.03) !important;
            border: 1px solid rgba(0, 240, 255, 0.2) !important;
            color: #fff !important;
            border-radius: 6px;
            padding: 0.75rem 1.2rem;
        }
        .form-control:focus {
            border-color: #00f0ff !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25) !important;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn-login {
            background: linear-gradient(90deg, #00f0ff 0%, #ff007f 100%);
            border: none;
            border-radius: 6px;
            padding: 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="login-brand mb-2">
            <i class="fa-solid fa-microchip me-2"></i>App Điều Khiển
        </div>
        <p class="text-muted small mb-4">Đăng nhập hệ thống điều khiển trung tâm</p>
        
        {% if error %}
        <div class="alert alert-danger border-danger border-opacity-30 bg-danger bg-opacity-10 text-white py-2 mb-4" role="alert" style="font-size: 0.85rem;">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/api/auth/login" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-muted small font-monospace">TÊN ĐĂNG NHẬP</label>
                <input type="text" name="username" class="form-control" placeholder="Username..." required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-muted small font-monospace">MẬT KHẨU</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-login w-100 mb-3">Login</button>
        </form>
    </div>
</body>
</html>
